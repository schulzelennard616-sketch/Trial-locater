name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hochgeladene ZIP entpacken
        run: find . -name '*.zip' -not -path './.git/*' -exec unzip -oq {} \;

      - name: Dateien im Repository anzeigen
        run: find . -not -path './.git/*' | head -80

      - name: Projektordner suchen
        id: find
        run: |
          FILE=$(find . -name build.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "FEHLER: Keine build.gradle gefunden."
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Mod bauen
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: trialfinder-mod
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
